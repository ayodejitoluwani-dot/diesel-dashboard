  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; background:#0B0F14; color:#E8EDF2; padding:28px 20px 60px; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .display { font-family:'Space Grotesk',sans-serif; }
  .wrap { max-width:980px; margin:0 auto; }
  .header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand-mark { background:#F5F3F7; border-radius:8px; padding:6px 10px; display:flex; align-items:center; line-height:0; }
  .brand-mark img { height:26px; width:auto; display:block; }
  .eyebrow { color:#4FD1C5; font-size:12px; letter-spacing:1px; margin-bottom:4px; }
  h1 { font-size:26px; font-weight:600; margin:0; }
  select { background:#131A22; border:1px solid #2A343F; color:#E8EDF2; border-radius:6px; padding:7px 10px; font-size:13px; font-family:'IBM Plex Mono',monospace; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toggle { display:flex; align-items:center; gap:6px; background:#131A22; border:1px solid #2A343F; border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; user-select:none; }
  .toggle.active { border-color:#E8A33D; color:#E8A33D; }
  .day-nav { display:flex; align-items:center; gap:4px; }
  .day-btn { background:#131A22; border:1px solid #2A343F; color:#E8EDF2; border-radius:6px; width:30px; height:30px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; }
  .day-btn:hover:not(:disabled) { border-color:#4FD1C5; color:#4FD1C5; }
  .day-btn:disabled { opacity:0.3; cursor:not-allowed; }
  .day-label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#556070; min-width:64px; text-align:center; }
  .vs-label { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8B98A5; }
  .alert, .error, .loading, .warn { display:none; align-items:center; gap:10px; border-radius:8px; padding:10px 14px; margin-bottom:20px; font-size:13px; }
  .alert.show, .error.show, .loading.show, .warn.show { display:flex; }
  .alert { background:rgba(229,72,77,0.08); border:1px solid rgba(229,72,77,0.35); }
  .error { background:rgba(229,72,77,0.12); border:1px solid rgba(229,72,77,0.5); }
  .warn { background:rgba(232,163,61,0.08); border:1px solid rgba(232,163,61,0.35); }
  .loading { background:#131A22; border:1px solid #2A343F; color:#8B98A5; font-family:'IBM Plex Mono',monospace; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi { background:#131A22; border:1px solid #2A343F; border-radius:10px; padding:14px 16px; }
  .kpi .label { font-size:11px; color:#8B98A5; margin-bottom:6px; }
  .kpi .value { font-size:20px; font-weight:600; }
  .kpi .unit { font-size:13px; color:#8B98A5; font-weight:400; }
  .kpi .delta { font-family:'IBM Plex Mono',monospace; font-size:12px; margin-top:4px; }
  .kpi .delta.up { color:#E5484D; }
  .kpi .delta.down { color:#4FD1C5; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { display:flex; align-items:center; gap:6px; background:transparent; border:1px solid #2A343F; color:#8B98A5; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit; }
  .tab.active { background:#1B242E; }
  .legend { display:flex; gap:16px; padding:0 14px 10px; font-size:12px; font-family:'IBM Plex Mono',monospace; color:#8B98A5; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .panel { background:#131A22; border:1px solid #2A343F; border-radius:10px; margin-bottom:22px; }
  .chart-panel { padding:18px 14px 8px; }
  svg text { font-family:'IBM Plex Mono',monospace; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:9px 14px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  th { color:#8B98A5; font-weight:500; border-bottom:1px solid #2A343F; cursor:pointer; user-select:none; white-space:nowrap; }
  tbody tr { border-bottom:1px solid #1C242D; }
  tbody tr:hover { background:#171F28; }
  td.mono, tbody { font-family:'IBM Plex Mono',monospace; }
  td:first-child { font-family:'Inter',sans-serif; }
  .flag-dot { color:#E5484D; margin-left:6px; }
  .notes { padding:14px 16px; font-size:13px; color:#C7D0D9; }
  .notes .label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B98A5; margin-bottom:6px; }
  .tooltip { position:absolute; pointer-events:none; background:#131A22; border:1px solid #2A343F; border-radius:6px; padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; display:none; z-index:10; }
  footer { text-align:center; color:#556070; font-size:11px; margin-top:30px; font-family:'IBM Plex Mono',monospace; }
  #dashboard { display:none; }
  #dashboard.show { display:block; }
</style>

<script>
// ---- Edit these three to point at your repo, then drop each day's tracker
// file into that folder (any filename ending in .xlsx). The page lists and
// parses everything it finds there automatically — no further edits needed. ----
const GITHUB_OWNER  = "ayodejitoluwani-dot";
const GITHUB_REPO   = "diesel-dashboard";
const GITHUB_BRANCH = "main";
const REPORTS_FOLDER = "reports";

const METRICS = {
  consumed: { label: "Diesel Consumed", unit: "L", color: "#E8A33D" },
  hours:    { label: "Generator Runtime", unit: "hrs", color: "#5B8DEF" },
  stock:    { label: "Diesel Stock", unit: "L", color: "#4FD1C5" },
  reserve:  { label: "External Reserve", unit: "L", color: "#B18CF0" }
};
const PROPERTY_ORDER = ["Venus","April","April (BIG) — Est.","Valley","Xii-Lungi","Niche","Stazia","Libreville","Guzape","Tranquillo Big","Tranquillo Small","Apex"];

let REPORTS = {};        // { "2026-09-07": { entries, comments, file }, ... }
let currentMetric = "consumed";
let compareMode = false;
let dateAKey = null, dateBKey = null;
let sortKey = null, sortDir = "desc";

function fmt(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function isFlagged(d) { return d.consumed === 0 && d.hours === 0 && d.stock === 0; }

function normalizeName(raw) {
  const n = raw.replace(/\u00a0/g, " ").trim().toLowerCase();
  if (n === "venus") return ["Venus"];
  if (n === "april") return ["April"];
  if (n.startsWith("april (big")) return ["April (BIG) — Est."];
  if (n === "valley") return ["Valley"];
  if (n === "xii-lungi") return ["Xii-Lungi"];
  if (n === "niche") return ["Niche"];
  if (n === "stazia") return ["Stazia"];
  if (n === "libreville") return ["Libreville"];
  if (n === "guzape") return ["Guzape"];
  if (n === "tranquillo big") return ["Tranquillo Big"];
  if (n === "tranquillo small") return ["Tranquillo Small"];
  if (n === "tranquillo") return ["Tranquillo Big", "Tranquillo Small"];
  if (n === "apex") return ["Apex"];
  return null;
}

function parseMetricSheet(wb, possibleNames) {
  const sheetName = wb.SheetNames.find(n => possibleNames.some(p => n.toLowerCase() === p.toLowerCase()));
  if (!sheetName) return {};
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });
  const map = {};
  rows.forEach(row => {
    const nonNull = (row || []).filter(c => c !== null && c !== undefined && c !== "");
    if (nonNull.length !== 2) return;
    const [rawName, rawVal] = nonNull;
    if (typeof rawName !== "string" || typeof rawVal !== "number") return;
    const canon = normalizeName(rawName);
    if (!canon) return;
    canon.forEach(c => { map[c] = rawVal; });
  });
  return map;
}

function parseReportMeta(wb, fallbackDate) {
  const sheetName = wb.SheetNames.find(n => n.toLowerCase().startsWith("report"));
  let date = null;
  const comments = [];
  if (sheetName) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });
    rows.forEach(row => {
      (row || []).forEach(cell => {
        if (cell instanceof Date && !isNaN(cell)) date = cell.toISOString().slice(0, 10);
        else if (typeof cell === "string") {
          const t = cell.replace(/\u00a0/g, " ").trim();
          if (t.startsWith("-")) comments.push(t.replace(/^-\s*/, ""));
        }
      });
    });
  }
  return { date: date || fallbackDate, comments: comments.join(" ") };
}

async function fetchFolderListing() {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${REPORTS_FOLDER}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(url);
  if (!res.ok) {
    if (res.status === 404) throw new Error(`No "${REPORTS_FOLDER}/" folder found in the repo yet. Create it and upload your daily .xlsx files there.`);
    if (res.status === 403) throw new Error("GitHub API rate limit hit — try again in a bit.");
    throw new Error(`Couldn't list files (HTTP ${res.status}).`);
  }
  const items = await res.json();
  return (Array.isArray(items) ? items : []).filter(f => f.name.toLowerCase().endsWith(".xlsx"));
}

async function loadAllReports() {
  const files = await fetchFolderListing();
  if (!files.length) throw new Error(`No .xlsx files found in "${REPORTS_FOLDER}/" yet.`);

  const failures = [];
  const collisions = [];
  for (const file of files) {
    try {
      const res = await fetch(file.download_url, { cache: "no-store" });
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });

      const consumedMap = parseMetricSheet(wb, ["Diesel Consumed"]);
      const hoursMap = parseMetricSheet(wb, ["Total Hours"]);
      const stockMap = parseMetricSheet(wb, ["Diesel Stock Level"]);
      const reserveMap = parseMetricSheet(wb, ["Diesel Reserve"]);
      const fallbackDate = file.name.replace(/\.xlsx$/i, "");
      const { date, comments } = parseReportMeta(wb, fallbackDate);

      const hasAnyData = [consumedMap, hoursMap, stockMap, reserveMap].some(m => Object.keys(m).length > 0);
      if (!hasAnyData) { failures.push(file.name); continue; }

      if (REPORTS[date]) {
        collisions.push(`${date} (${REPORTS[date].file} overwritten by ${file.name})`);
      }
      const entries = PROPERTY_ORDER.map(name => ({
        name,
        consumed: consumedMap[name] ?? null,
        hours: hoursMap[name] ?? null,
        stock: stockMap[name] ?? null,
        reserve: reserveMap[name] ?? null
      }));
      REPORTS[date] = { entries, comments, file: file.name };
    } catch (e) {
      failures.push(file.name);
    }
  }
  return { failures, collisions };
}

function totalsFor(entries) {
  const t = entries.reduce((acc, d) => {
    acc.consumed += d.consumed || 0; acc.hours += d.hours || 0;
    acc.stock += d.stock || 0; acc.reserve += d.reserve || 0;
    return acc;
  }, { consumed: 0, hours: 0, stock: 0, reserve: 0 });
  t.avgRate = t.hours ? t.consumed / t.hours : 0;
  return t;
}

function populateDateSelects() {
  const dates = Object.keys(REPORTS).sort();
  const selA = document.getElementById("dateA");
  const selB = document.getElementById("dateB");
  selA.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
  selB.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
  dateAKey = dates[dates.length - 1];
  dateBKey = dates.length > 1 ? dates[dates.length - 2] : dates[0];
  selA.value = dateAKey;
  selB.value = dateBKey;
  selA.onchange = () => { dateAKey = selA.value; renderAll(); };
  selB.onchange = () => { dateBKey = selB.value; renderAll(); };

  document.getElementById("prevDay").onclick = () => stepDay(-1);
  document.getElementById("nextDay").onclick = () => stepDay(1);
}

function stepDay(delta) {
  const dates = Object.keys(REPORTS).sort();
  const idx = dates.indexOf(dateAKey);
  const next = idx + delta;
  if (next < 0 || next >= dates.length) return;
  dateAKey = dates[next];
  document.getElementById("dateA").value = dateAKey;
  renderAll();
}

function updateDayNav() {
  const dates = Object.keys(REPORTS).sort();
  const idx = dates.indexOf(dateAKey);
  document.getElementById("prevDay").disabled = idx <= 0;
  document.getElementById("nextDay").disabled = idx >= dates.length - 1;
  document.getElementById("dayPosLabel").textContent = dates.length ? `${idx + 1} / ${dates.length}` : "";
}

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = Object.entries(METRICS).map(([key, cfg]) => `
    <button class="tab ${key === currentMetric ? 'active' : ''}" data-metric="${key}"
      style="color:${key === currentMetric ? cfg.color : '#8B98A5'}; border-color:${key === currentMetric ? cfg.color : '#2A343F'};">
      ${cfg.label}
    </button>`).join("");
  el.querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => { currentMetric = btn.dataset.metric; renderAll(); };
  });
}

function renderKPIsSingle(entries) {
  const t = totalsFor(entries);
  const items = [
    { label: "Total Consumed", value: t.consumed, unit: "L" },
    { label: "Total Runtime", value: t.hours, unit: "hrs" },
    { label: "Avg Hourly Usage", value: t.avgRate, unit: "L/hr" },
    { label: "Total Stock", value: t.stock, unit: "L" },
    { label: "External Reserve", value: t.reserve, unit: "L" }
  ];
  document.getElementById("kpis").innerHTML = items.map(k => `
    <div class="kpi"><div class="label mono">${k.label.toUpperCase()}</div>
      <div class="value display">${fmt(k.value)} <span class="unit">${k.unit}</span></div></div>`).join("");
}

function renderKPIsCompare(entriesA, entriesB) {
  const tA = totalsFor(entriesA), tB = totalsFor(entriesB);
  const items = [
    { label: "Total Consumed", key: "consumed", unit: "L" },
    { label: "Total Runtime", key: "hours", unit: "hrs" },
    { label: "Avg Hourly Usage", key: "avgRate", unit: "L/hr" },
    { label: "Total Stock", key: "stock", unit: "L" },
    { label: "External Reserve", key: "reserve", unit: "L" }
  ];
  document.getElementById("kpis").innerHTML = items.map(k => {
    const a = tA[k.key], b = tB[k.key];
    const delta = b - a;
    const dirClass = delta > 0 ? "up" : delta < 0 ? "down" : "";
    const arrow = delta > 0 ? "▲" : delta < 0 ? "▼" : "•";
    return `<div class="kpi"><div class="label mono">${k.label.toUpperCase()}</div>
      <div class="value display">${fmt(b)} <span class="unit">${k.unit}</span></div>
      <div class="delta ${dirClass} mono">${arrow} ${fmt(Math.abs(delta))} vs ${dateAKey}</div></div>`;
  }).join("");
}

function renderChartSingle(entries) {
  const cfg = METRICS[currentMetric];
  const rows = entries.filter(d => d[currentMetric] !== null && d[currentMetric] !== undefined);
  const w = 900, h = 280, padL = 44, padB = 74, padT = 10;
  const maxVal = Math.max(1, ...rows.map(d => d[currentMetric]));
  const barW = (w - padL - 20) / rows.length;
  let bars = "", labels = "";
  rows.forEach((d, i) => {
    const val = d[currentMetric];
    const barH = ((h - padT - padB) * val) / maxVal;
    const x = padL + i * barW + barW * 0.15, y = h - padB - barH, bw = barW * 0.7;
    const fill = isFlagged(d) ? "#E5484D" : cfg.color;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(barH,1)}" rx="4" fill="${fill}" data-name="${d.name}" data-value="${val}" class="bar" style="cursor:pointer;"></rect>`;
    labels += `<text x="${x + bw/2}" y="${h - padB + 16}" fill="#8B98A5" font-size="10" text-anchor="end" transform="rotate(-30 ${x + bw/2} ${h - padB + 16})">${d.name}</text>`;
  });
  renderChartSVG(w, h, padL, padB, padT, maxVal, bars, labels, entries, cfg);
  document.getElementById("legend").style.display = "none";
}

function renderChartCompare(entriesA, entriesB) {
  const cfg = METRICS[currentMetric];
  const names = PROPERTY_ORDER.filter(n => {
    const a = entriesA.find(x => x.name === n), b = entriesB.find(x => x.name === n);
    return a && b && a[currentMetric] !== null && b[currentMetric] !== null;
  });
  const w = 900, h = 280, padL = 44, padB = 74, padT = 10;
  const groupW = (w - padL - 20) / names.length;
  const maxVal = Math.max(1, ...names.map(n => Math.max(
    entriesA.find(x => x.name === n)[currentMetric],
    entriesB.find(x => x.name === n)[currentMetric]
  )));
  let bars = "", labels = "";
  const colorA = "#5A6673", colorB = cfg.color;
  names.forEach((n, i) => {
    const dA = entriesA.find(x => x.name === n), dB = entriesB.find(x => x.name === n);
    const bw = groupW * 0.32;
    const gx = padL + i * groupW + groupW * 0.12;
    [{ d: dA, color: isFlagged(dA) ? "#E5484D" : colorA, off: 0 }, { d: dB, color: isFlagged(dB) ? "#E5484D" : colorB, off: bw + 4 }].forEach(({ d, color, off }) => {
      const val = d[currentMetric];
      const barH = ((h - padT - padB) * val) / maxVal;
      const x = gx + off, y = h - padB - barH;
      bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(barH,1)}" rx="3" fill="${color}" data-name="${d.name}" data-value="${val}" class="bar" style="cursor:pointer;"></rect>`;
    });
    labels += `<text x="${gx + bw + 2}" y="${h - padB + 16}" fill="#8B98A5" font-size="10" text-anchor="end" transform="rotate(-30 ${gx + bw + 2} ${h - padB + 16})">${n}</text>`;
  });
  renderChartSVG(w, h, padL, padB, padT, maxVal, bars, labels, [...entriesA, ...entriesB], cfg);
  const legend = document.getElementById("legend");
  legend.style.display = "flex";
  legend.innerHTML = `<span><span class="swatch" style="background:${colorA}"></span>${dateAKey}</span><span><span class="swatch" style="background:${colorB}"></span>${dateBKey}</span>`;
}

function renderChartSVG(w, h, padL, padB, padT, maxVal, bars, labels, allEntries, cfg) {
  let grid = "";
  for (let g = 0; g <= 4; g++) {
    const gy = padT + (h - padT - padB) * (1 - g / 4);
    const gv = (maxVal * g) / 4;
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-10}" y2="${gy}" stroke="#20293380" stroke-dasharray="3 3"/>`;
    grid += `<text x="${padL - 8}" y="${gy + 3}" fill="#8B98A5" font-size="11" text-anchor="end">${fmt(gv)}</text>`;
  }
  document.getElementById("chart").innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="280" style="display:block;">${grid}${bars}${labels}</svg>`;
  const tooltip = document.getElementById("tooltip");
  document.querySelectorAll(".bar").forEach(bar => {
    bar.addEventListener("mousemove", (e) => {
      tooltip.style.display = "block";
      tooltip.style.left = e.pageX + 12 + "px";
      tooltip.style.top = e.pageY - 40 + "px";
      tooltip.innerHTML = `<div style="color:#8B98A5;margin-bottom:2px;">${bar.dataset.name}</div><div style="font-size:15px;font-weight:600;">${fmt(parseFloat(bar.dataset.value))} ${cfg.unit}</div>`;
    });
    bar.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
  });
}

function renderTableSingle(entries) {
  const head = document.getElementById("tableHead");
  head.innerHTML = `<th>Property</th>` + Object.entries(METRICS).map(([key,cfg]) => `<th data-key="${key}">${cfg.label} (${cfg.unit})</th>`).join("");
  head.querySelectorAll("th[data-key]").forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc"; else { sortKey = key; sortDir = "desc"; }
      renderAll();
    };
  });
  let rows = [...entries];
  if (sortKey) rows.sort((a,b) => { const av=a[sortKey]??-1, bv=b[sortKey]??-1; return sortDir==="asc"?av-bv:bv-av; });
  document.getElementById("tableBody").innerHTML = rows.map(d => `
    <tr><td>${d.name}${isFlagged(d) ? '<span class="flag-dot">⚠</span>' : ''}</td>
    ${Object.keys(METRICS).map(key => `<td class="mono" style="color:${d[key] ? '#E8EDF2' : '#5A6673'}">${fmt(d[key])}</td>`).join("")}</tr>`).join("");
}

function renderTableCompare(entriesA, entriesB) {
  const cfg = METRICS[currentMetric];
  const head = document.getElementById("tableHead");
  head.innerHTML = `<th>Property</th><th data-key="a">${dateAKey} (${cfg.unit})</th><th data-key="b">${dateBKey} (${cfg.unit})</th><th data-key="delta">Δ</th>`;
  let rows = PROPERTY_ORDER.map(name => {
    const a = entriesA.find(x => x.name === name)[currentMetric];
    const b = entriesB.find(x => x.name === name)[currentMetric];
    const delta = (a !== null && b !== null) ? b - a : null;
    return { name, a, b, delta };
  });
  head.querySelectorAll("th[data-key]").forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc"; else { sortKey = key; sortDir = "desc"; }
      renderAll();
    };
  });
  if (sortKey) rows.sort((r1,r2) => { const v1=r1[sortKey]??-999, v2=r2[sortKey]??-999; return sortDir==="asc"?v1-v2:v2-v1; });
  document.getElementById("tableBody").innerHTML = rows.map(r => {
    const dirColor = r.delta > 0 ? "#E5484D" : r.delta < 0 ? "#4FD1C5" : "#8B98A5";
    return `<tr><td>${r.name}</td>
      <td class="mono" style="color:${r.a ? '#E8EDF2' : '#5A6673'}">${fmt(r.a)}</td>
      <td class="mono" style="color:${r.b ? '#E8EDF2' : '#5A6673'}">${fmt(r.b)}</td>
      <td class="mono" style="color:${dirColor}">${r.delta === null ? '—' : (r.delta > 0 ? '+' : '') + fmt(r.delta)}</td></tr>`;
  }).join("");
}

function renderAll() {
  document.getElementById("dateA").style.display = "inline-block";
  document.getElementById("vsLabel").style.display = compareMode ? "inline" : "none";
  document.getElementById("dateB").style.display = compareMode ? "inline-block" : "none";
  document.getElementById("compareToggle").classList.toggle("active", compareMode);
  updateDayNav();

  renderTabs();

  if (!compareMode) {
    const report = REPORTS[dateAKey];
    renderAlertSingle(report.entries);
    renderKPIsSingle(report.entries);
    renderChartSingle(report.entries);
    renderTableSingle(report.entries);
    document.getElementById("commentsText").textContent = report.comments || "—";
  } else {
    const rA = REPORTS[dateAKey], rB = REPORTS[dateBKey];
    document.getElementById("alertBox").classList.remove("show");
    renderKPIsCompare(rA.entries, rB.entries);
    renderChartCompare(rA.entries, rB.entries);
    renderTableCompare(rA.entries, rB.entries);
    document.getElementById("commentsText").textContent = `${dateAKey}: ${rA.comments || "—"}  /  ${dateBKey}: ${rB.comments || "—"}`;
  }
}

function renderAlertSingle(entries) {
  const flagged = entries.filter(isFlagged);
  const box = document.getElementById("alertBox"), text = document.getElementById("alertText");
  if (flagged.length) { box.classList.add("show"); text.textContent = flagged.map(f => f.name).join(", ") + " — zero consumption, runtime and stock. Verify meter or connectivity."; }
  else box.classList.remove("show");
}

function showError(msg) {
  document.getElementById("loadingBox").classList.remove("show");
  const box = document.getElementById("errorBox");
  box.classList.add("show");
  box.textContent = msg;
}

async function init() {
  try {
    const { failures, collisions } = await loadAllReports();
    if (Object.keys(REPORTS).length === 0) throw new Error("No reports could be read — check the files match the tracker's sheet layout.");

    populateDateSelects();
    document.getElementById("folderLabel").textContent = `${REPORTS_FOLDER}/`;
    document.getElementById("compareToggle").onclick = () => {
      compareMode = !compareMode;
      if (compareMode && dateAKey === dateBKey) {
        const dates = Object.keys(REPORTS).sort();
        if (dates.length > 1) { dateBKey = dates[dates.length - 2]; document.getElementById("dateB").value = dateBKey; }
      }
      renderAll();
    };

    if (failures.length || collisions.length) {
      const warn = document.getElementById("warnBox");
      warn.classList.add("show");
      const parts = [];
      if (failures.length) parts.push(`Skipped ${failures.length} file(s) that didn't match the expected format: ${failures.join(", ")}`);
      if (collisions.length) parts.push(`Same-date collisions: ${collisions.join("; ")}`);
      warn.textContent = parts.join(" — ");
    }

    renderAll();
    document.getElementById("loadingBox").classList.remove("show");
    document.getElementById("dashboard").classList.add("show");
  } catch (err) {
    showError(err.message || "Something went wrong loading the reports.");
  }
}

init();
</script>
</body>
</html>
